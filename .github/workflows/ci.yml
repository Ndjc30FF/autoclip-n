name: AutoClip Web - Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: autoclip-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoclip-web:
    name: AutoClip Web Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: "📥 Checkout AutoClip"
        uses: actions/checkout@v4

      - name: "🔍 Check environment"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "                 AUTOCLIP WEB RUNTIME"
          echo "============================================================"

          echo "Repository:"
          pwd

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Docker Compose:"
          docker compose version

          echo
          echo "Files:"
          ls -la

      - name: "📁 Prepare directories"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p data
          mkdir -p logs
          mkdir -p uploads

          chmod -R u+rwX data logs uploads

          echo "Directories ready."

      - name: "⚙️ Configure AutoClip"
        shell: bash
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          API_MODEL_NAME: ${{ secrets.API_MODEL_NAME }}
          API_DASHSCOPE_API_KEY: ${{ secrets.API_DASHSCOPE_API_KEY }}
          API_OPENAI_API_KEY: ${{ secrets.API_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          API_GEMINI_API_KEY: ${{ secrets.API_GEMINI_API_KEY }}
          API_SILICONFLOW_API_KEY: ${{ secrets.API_SILICONFLOW_API_KEY }}

        run: |
          set -Eeuo pipefail

          printf '%s\n' "LLM_PROVIDER=${LLM_PROVIDER:-dashscope}" > .env
          printf '%s\n' "API_MODEL_NAME=${API_MODEL_NAME:-qwen-plus}" >> .env
          printf '%s\n' "API_DASHSCOPE_API_KEY=${API_DASHSCOPE_API_KEY:-}" >> .env
          printf '%s\n' "API_OPENAI_API_KEY=${API_OPENAI_API_KEY:-}" >> .env
          printf '%s\n' "OPENAI_BASE_URL=${OPENAI_BASE_URL:-}" >> .env
          printf '%s\n' "DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}" >> .env
          printf '%s\n' "API_GEMINI_API_KEY=${API_GEMINI_API_KEY:-}" >> .env
          printf '%s\n' "API_SILICONFLOW_API_KEY=${API_SILICONFLOW_API_KEY:-}" >> .env

          echo "AutoClip environment configured."

      - name: "🧪 Validate Docker Compose"
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose config --quiet

          echo "Docker Compose configuration is valid."

      - name: "🐳 Build AutoClip"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Building AutoClip..."

          docker compose build --pull

          echo "Build completed."

      - name: "🚀 Start AutoClip"
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose up -d

          echo
          echo "============================================================"
          echo "                 CONTAINER STATUS"
          echo "============================================================"

          docker compose ps

      - name: "❤️ Wait for AutoClip API"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for AutoClip API..."

          READY=0

          for attempt in $(seq 1 120); do

            if curl -fsS \
              --max-time 5 \
              http://127.0.0.1:8000/api/v1/health/ \
              >/tmp/autoclip-health.json 2>/dev/null; then

              echo
              echo "============================================================"
              echo "              AUTOCLIP API IS READY"
              echo "============================================================"

              cat /tmp/autoclip-health.json

              READY=1
              break
            fi

            echo "API not ready: ${attempt}/120"
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then

            echo
            echo "============================================================"
            echo "              AUTOCLIP API FAILED"
            echo "============================================================"

            docker compose ps

            echo
            echo "--- AutoClip logs ---"
            docker compose logs --tail=300 autoclip

            echo
            echo "--- Redis logs ---"
            docker compose logs --tail=150 redis

            echo
            echo "--- Celery logs ---"
            docker compose logs --tail=150 celery-worker

            exit 1
          fi

      - name: "🌐 Detect AutoClip Web Interface"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking AutoClip web interface..."

          WEB_PORT=""

          if curl -fsS \
            --max-time 5 \
            http://127.0.0.1:3000/ \
            >/tmp/autoclip-web.html 2>/dev/null; then

            WEB_PORT="3000"

          elif curl -fsS \
            --max-time 5 \
            http://127.0.0.1:8000/ \
            >/tmp/autoclip-web.html 2>/dev/null; then

            WEB_PORT="8000"

          fi

          if [ -z "$WEB_PORT" ]; then

            echo
            echo "ERROR: AutoClip Web UI could not be detected."

            echo
            echo "--- Docker status ---"
            docker compose ps

            echo
            echo "--- AutoClip logs ---"
            docker compose logs --tail=300 autoclip

            exit 1
          fi

          echo "AutoClip Web UI detected on port: $WEB_PORT"

          echo "AUTOCLIP_WEB_PORT=$WEB_PORT" >> "$GITHUB_ENV"

      - name: "🔎 Show local Web URL"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "                  LOCAL WEB SERVICE"
          echo "============================================================"
          echo
          echo "Port:"
          echo "$AUTOCLIP_WEB_PORT"
          echo
          echo "URL:"
          echo "http://127.0.0.1:$AUTOCLIP_WEB_PORT"
          echo
          echo "============================================================"

      - name: "☁️ Install Cloudflared"
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      - name: "🔗 Start Cloudflare Tunnel"
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f /tmp/cloudflared.log
          rm -f /tmp/cloudflare-url.txt

          echo
          echo "============================================================"
          echo "              STARTING CLOUDFLARE TUNNEL"
          echo "============================================================"

          nohup cloudflared tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:$AUTOCLIP_WEB_PORT" \
            >/tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          printf '%s\n' "$CLOUDFLARED_PID" >/tmp/cloudflared.pid

          echo "cloudflared PID: $CLOUDFLARED_PID"

          TUNNEL_URL=""

          for attempt in $(seq 1 60); do

            sleep 2

            TUNNEL_URL="$(
              grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 \
              || true
            )"

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            echo "Waiting for Cloudflare URL: ${attempt}/60"
          done

          if [ -z "$TUNNEL_URL" ]; then

            echo
            echo "============================================================"
            echo "          CLOUDFLARE TUNNEL FAILED"
            echo "============================================================"

            cat /tmp/cloudflared.log || true

            exit 1
          fi

          printf '%s\n' "AUTOCLIP_PUBLIC_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "             🚀 AUTOCLIP IS ONLINE"
          echo "============================================================"
          echo
          echo "PUBLIC WEB URL:"
          echo
          echo "$TUNNEL_URL"
          echo
          echo "API:"
          echo
          echo "$TUNNEL_URL/docs"
          echo
          echo "============================================================"

      - name: "🌍 Verify public website"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Cloudflare public URL..."

          READY=0

          for attempt in $(seq 1 30); do

            if curl -fsS \
              --max-time 15 \
              "$AUTOCLIP_PUBLIC_URL/" \
              >/tmp/public-autoclip.html 2>/dev/null; then

              echo
              echo "============================================================"
              echo "          PUBLIC WEBSITE IS WORKING"
              echo "============================================================"
              echo
              echo "$AUTOCLIP_PUBLIC_URL"
              echo
              echo "============================================================"

              READY=1
              break
            fi

            echo "Waiting for public website: ${attempt}/30"
            sleep 4
          done

          if [ "$READY" -ne 1 ]; then

            echo
            echo "Public Cloudflare URL did not respond."

            echo
            echo "--- Cloudflare logs ---"
            cat /tmp/cloudflared.log || true

            exit 1
          fi

      - name: "📌 Publish access information"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                  AUTOCLIP WEB ACCESS                     ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║                                                            ║"
          echo "║  WEBSITE:                                                  ║"
          echo "║  $AUTOCLIP_PUBLIC_URL"
          echo "║                                                            ║"
          echo "║  API DOCS:                                                 ║"
          echo "║  $AUTOCLIP_PUBLIC_URL/docs"
          echo "║                                                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"

      - name: "⏳ Keep AutoClip Running"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo
          echo "============================================================"
          echo "             AUTOCLIP CLOUD SERVICE ACTIVE"
          echo "============================================================"
          echo
          echo "Website:"
          echo "$AUTOCLIP_PUBLIC_URL"
          echo
          echo "API:"
          echo "$AUTOCLIP_PUBLIC_URL/docs"
          echo
          echo "This step intentionally stays running."
          echo "The website remains available while this job is running."
          echo
          echo "============================================================"

          while true; do

            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then

              echo
              echo "ERROR: Cloudflare tunnel stopped."

              cat /tmp/cloudflared.log || true

              exit 1
            fi

            if ! curl -fsS \
              --max-time 10 \
              http://127.0.0.1:8000/api/v1/health/ \
              >/dev/null 2>&1; then

              echo
              echo "WARNING: AutoClip API health check failed."

              docker compose ps
            fi

            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] AutoClip is running."

            sleep 60
          done

      - name: "🛠️ Diagnostics"
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "              AUTOCLIP DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "--- Docker containers ---"
          docker compose ps

          echo
          echo "--- AutoClip ---"
          docker compose logs --tail=300 autoclip

          echo
          echo "--- Celery Worker ---"
          docker compose logs --tail=200 celery-worker

          echo
          echo "--- Celery Beat ---"
          docker compose logs --tail=150 celery-beat

          echo
          echo "--- Redis ---"
          docker compose logs --tail=150 redis

          echo
          echo "--- Cloudflare ---"
          cat /tmp/cloudflared.log 2>/dev/null || true
